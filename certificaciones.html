<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Certificaciones</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page-shell">

    <nav class="site-nav">
      <div class="nav-pill" style="justify-content:flex-start;">
        <a href="index.html" class="back-link" style="color:var(--accent);"><span class="arrow-ic">&lt;-</span> Volver al inicio</a>
      </div>
    </nav>

    <section class="section-pad" style="position:relative;max-width:1140px;margin:0 auto;padding-top:50px;padding-bottom:10px;">
      <div style="text-align:center;margin:0 0 40px;">
        <div class="section-divider"></div>
        <h2 style="margin:0;font-weight:700;font-size:38px;">Certificaciones</h2>
      </div>
    </section>

    <section class="section-pad" style="position:relative;padding-top:0;padding-bottom:70px;">
      <div style="max-width:1140px;margin:0 auto;">
        <div class="certgrid" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;">

          <div class="card-c" style="padding:28px;text-align:center;">
            <div class="cert-icon" aria-hidden="true">workspace_premium</div>
            <h3 style="margin:0 0 8px;font-size:16px;font-weight:500;">[Nombre de la certificación]</h3>
            <p style="margin:0;font-size:13px;color:var(--text-dim);">[Entidad emisora] · [Año]</p>
            <div style="text-align:center;margin-top:14px;">
              <a href="#" class="link-c" style="font-size:13px;color:var(--accent);">Ver certificación <span class="arrow-ic">-&gt;</span></a>
            </div>
          </div>

          <div class="card-empty"></div>
          <div class="card-empty"></div>

        </div>
      </div>
    </section>

    <footer class="site-footer">
      <div style="display:flex;gap:22px;">
        <a href="https://linkedin.com/" class="pill-c pill-sm"><span class="icon-gs" aria-hidden="true" style="font-size:15px;">link</span>LinkedIn</a>
        <a href="https://github.com/" class="pill-c pill-sm"><span class="icon-gs" aria-hidden="true" style="font-size:15px;">code</span>GitHub</a>
      </div>
    </footer>

  </div>
</body>
</html>
